name: v95 nightly offline benchmark

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  offline-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline contract tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q tests/test_v95_*.py
      - name: Validate benchmark fixture
        run: python scripts/v95_nightly_benchmark.py tests/fixtures/v95_benchmark_report.json
