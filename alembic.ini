# alembic.ini — Alembic configuration for WebPent V6 Ultimate
# =============================================================================
# The database URL is read from the env.py script (which pulls from
# settings.py), NOT from this ini file. This ensures the path is always
# consistent with the framework's configuration.
# =============================================================================

[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
