# docker-compose.dev.yml
# =============================================================================
# WebPent V10 — DEVELOPMENT / LAB Compose (NOT FOR PRODUCTION)
# =============================================================================
# WARNING: this compose file is for local lab and development ONLY.
# It has AUTH_ENABLED=false, weak/default secrets, and exposed ports
# for easy debugging. NEVER deploy this to a production environment.
# For production, use docker-compose.yml (which has AUTH_ENABLED=true,
# no weak fallbacks, and internal-only networking).
#
# Volume mounts for instant code changes. uvicorn --reload for live API restart.
# Security features (auth, rate limiting) default to disabled via .env.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d --build
#   docker-compose -f docker-compose.dev.yml logs -f api worker
#   docker-compose -f docker-compose.dev.yml down
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: webpent-dev-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - webpent-dev

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-webpent-base:latest}
    container_name: webpent-dev-api
    # V7 Ready-For-Kali FIX (regression restored): removed the
    # `user: "${UID:-1000}:${GID:-1000}"` directive again. It conflicts
    # with entrypoint.sh (which needs to start as root to chown
    # bind-mounted files, then drops privileges itself via gosu) and
    # $UID rarely resolves to the real host UID anyway (bash shell
    # parameter, not an exported env var, in most configs). See
    # entrypoint.sh for the actual, working fix.
    # V7 Fix 2.1+2.2: Plain reload flag (uvicorn monitors WORKDIR=/app
    # by default). Fix app module from server:app to webpent.api.app:app.
    command: >-
      uvicorn webpent.api.app:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - WEBPENT_REDIS_URL=${WEBPENT_REDIS_URL:-redis://redis:6379/0}
      - BBSCOUT_ENABLED=${BBSCOUT_ENABLED:-false}
      - BBSCOUT_PACKAGE_PATH=${BBSCOUT_PACKAGE_PATH:-/run/webpent/bbscout/target-package.json}
      - BBSCOUT_ALLOWED_PROVIDER_IDS=${BBSCOUT_ALLOWED_PROVIDER_IDS:-}
      - BBSCOUT_ALLOWED_PROGRAM_IDS=${BBSCOUT_ALLOWED_PROGRAM_IDS:-}
      - BBSCOUT_MODE=${BBSCOUT_MODE:-offline}
      - BBSCOUT_REQUIRE_VERIFIED_SIGNATURE=${BBSCOUT_REQUIRE_VERIFIED_SIGNATURE:-true}
      - BBSCOUT_BROWSER_ENABLED=${BBSCOUT_BROWSER_ENABLED:-false}
      - BBSCOUT_BROWSER_READ_ONLY=${BBSCOUT_BROWSER_READ_ONLY:-true}
      - BBSCOUT_SIGNUP_ENABLED=${BBSCOUT_SIGNUP_ENABLED:-false}
      - BBSCOUT_PROVIDER_SUBMISSION_ENABLED=${BBSCOUT_PROVIDER_SUBMISSION_ENABLED:-false}
      - PYTHONUNBUFFERED=1
      # Bind-mounted development trees may be mode 0700 and owned by the host UID.
      # The entrypoint drops to this non-root identity before starting Uvicorn.
      - WEBPENT_RUN_AS_UID=${WEBPENT_RUN_AS_UID:-1000}
      - WEBPENT_RUN_AS_GID=${WEBPENT_RUN_AS_GID:-1000}
      # V6 Develop-First: auth + rate limit disabled by default
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - LOG_FORMAT=text
      - LOG_LEVEL=DEBUG
      # V6.1 P2: Uncomment for macOS/Windows live-reload support
      # - WATCHFILES_FORCE_POLLING=1
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./main.py:/app/main.py
      - ./server.py:/app/server.py
      - ./worker.py:/app/worker.py
      - ./pyproject.toml:/app/pyproject.toml
      - ./output:/app/output
      - ./memory:/app/memory
      - ./webpent.db:/app/webpent.db
      - ${BBSCOUT_PACKAGE_HOST_PATH:-./config/bbscout}:/run/webpent/bbscout:ro
    networks:
      - webpent-dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-webpent-base:latest}
    # Keep worker identity Compose-managed: P9 must support
    # `docker compose --scale worker=N` for lease/recovery tests.
    # The Compose service DNS name remains `worker` for broker URLs.
    # V7 Fix 2.3: Removed reload flags from celery (unsupported natively).
    command: >-
      celery -A worker.celery_app worker
      --loglevel=debug
      --concurrency=1
    # V6.1 P1: Disable healthcheck on worker — it inherits the API's
    # HEALTHCHECK from the Dockerfile which checks :8000/health.
    # The worker doesn't serve HTTP, so the check always fails and
    # marks it as unhealthy.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - WEBPENT_REDIS_URL=${WEBPENT_REDIS_URL:-redis://redis:6379/0}
      - BBSCOUT_ENABLED=${BBSCOUT_ENABLED:-false}
      - BBSCOUT_PACKAGE_PATH=${BBSCOUT_PACKAGE_PATH:-/run/webpent/bbscout/target-package.json}
      - BBSCOUT_ALLOWED_PROVIDER_IDS=${BBSCOUT_ALLOWED_PROVIDER_IDS:-}
      - BBSCOUT_ALLOWED_PROGRAM_IDS=${BBSCOUT_ALLOWED_PROGRAM_IDS:-}
      - BBSCOUT_MODE=${BBSCOUT_MODE:-offline}
      - BBSCOUT_REQUIRE_VERIFIED_SIGNATURE=${BBSCOUT_REQUIRE_VERIFIED_SIGNATURE:-true}
      - BBSCOUT_BROWSER_ENABLED=${BBSCOUT_BROWSER_ENABLED:-false}
      - BBSCOUT_BROWSER_READ_ONLY=${BBSCOUT_BROWSER_READ_ONLY:-true}
      - BBSCOUT_SIGNUP_ENABLED=${BBSCOUT_SIGNUP_ENABLED:-false}
      - BBSCOUT_PROVIDER_SUBMISSION_ENABLED=${BBSCOUT_PROVIDER_SUBMISSION_ENABLED:-false}
      - PYTHONUNBUFFERED=1
      # Keep API and worker on the same non-root host identity for bind mounts.
      - WEBPENT_RUN_AS_UID=${WEBPENT_RUN_AS_UID:-1000}
      - WEBPENT_RUN_AS_GID=${WEBPENT_RUN_AS_GID:-1000}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - LOG_FORMAT=text
      - LOG_LEVEL=DEBUG
      # V6.1 P2: Uncomment for macOS/Windows live-reload support
      # - WATCHFILES_FORCE_POLLING=1
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./main.py:/app/main.py
      - ./server.py:/app/server.py
      - ./worker.py:/app/worker.py
      - ./pyproject.toml:/app/pyproject.toml
      - ./output:/app/output
      - ./memory:/app/memory
      - ./webpent.db:/app/webpent.db
      - ${BBSCOUT_PACKAGE_HOST_PATH:-./config/bbscout}:/run/webpent/bbscout:ro
    networks:
      - webpent-dev

  # V6 Ultimate: Cloudflare Tunnel for OOB callbacks
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webpent-dev-tunnel
    command: tunnel --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - webpent-dev
    profiles:
      - tunnel  # Only starts with --profile tunnel

networks:
  webpent-dev:
    driver: bridge
    name: webpent-dev-net
