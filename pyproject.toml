# pyproject.toml
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webpent"
version = "0.3.0"
description = "WebPent Framework V3 - Autonomous pentesting with HITL approval, RAG, active browser exploitation, GPU acceleration, and professional HTML reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "WebPent Team", email = "security@example.com" },
]
keywords = ["security", "pentesting", "langgraph", "multi-agent", "web-security", "autonomous-exploitation", "rag", "hitl", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "torch>=2.2.0",
    # Keep the graph/checkpoint APIs on the v59-tested generation. Broad
    # lower bounds allowed major-version drift and made clean installs
    # backtrack for many minutes across incompatible provider packages.
    "langgraph>=0.2.0,<1.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<3.0",
    "langchain-core>=0.3.86,<0.4.0",
    # V7 Phase 6 FIX: langchain-community pinned to a verified-working
    # 0.3.x range instead of the previous unbounded `>=0.3.0`. The
    # unbounded floor let pip resolve to versions where provider
    # integrations had been split out into standalone packages
    # (Cloudflare Workers AI in particular moved to langchain-cloudflare).
    # The duplicate `langchain-community>=0.2.0` line that was previously
    # also present here is removed — duplicate deps are functionally
    # harmless (pip silently picks the higher floor) but confusing.
    "langchain-community>=0.3.18,<0.4",
    # V7 Phase 6 FIX: Cloudflare Workers AI now lives in its own
    # standalone package (LangChain's ongoing trend of splitting
    # providers out of langchain-community). _build_cloudflare() in
    # src/webpent/shared/llm.py tries langchain_cloudflare first and
    # falls back to langchain_community for backward compatibility.
    "langchain-cloudflare>=0.1.0",
    "pyyaml>=6.0",
    "langchain-openai>=0.2.0,<0.4",
    "langchain-mistralai>=0.2.0,<0.4",
    "langchain-google-genai>=2.0.0,<3.0.0",
    # V8.1 REGRESSION RE-FIX: this pin reverted to the pre-V7-Phase-6-fix
    # state (>=0.1.4,<0.2) in a later editing round that appears to have
    # branched from an older tree. >=0.1.4,<0.2 requires
    # langchain-core<0.2.0/<0.3 (version-dependent), which directly
    # conflicts with this project's own langchain-core>=0.3.0 above —
    # this is the exact ResolutionImpossible seen in `pip install -e .`
    # on the app Dockerfile. Verified against actual package source
    # (diffed langchain_cohere.chat_models across versions): the v2 API
    # code path (`self.client.v2.chat(...)`) first appears in 0.4.1;
    # every version before that only builds v1-style requests. Floor
    # bumped back to 0.4.1, confirmed via a real `pip install --dry-run`
    # resolution: resolves cleanly to langchain-cohere-0.4.6 +
    # langchain-core-0.3.86 with zero conflicts.
    "langchain-cohere>=0.4.1,<0.5",
    # Anthropic is routed lazily from llm.py so offline mode still works
    # without provider calls; declaring it here makes the configured online
    # path reproducible for standard project installations.
    "langchain-anthropic>=0.3.0,<0.4",
    "langchain-chroma>=0.1.0,<0.3",
    "chromadb>=0.5.0,<1.0",
    "sentence-transformers>=2.7.0",
    "pypdf>=4.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # P0-4: route_web_socket() was added in Playwright 1.48 and is
    # required for the browser SSRF guard to cover ws:// and wss://.
    # Keep the dependency aligned with Dockerfile.base's preinstalled
    # browser so pip does not silently install a mismatched Chromium.
    "playwright>=1.48.0,<1.49",
    # V10 P0-1 (RCA follow-up): alembic was previously NOT listed as a
    # runtime dependency — db.init_db() silently fell back to legacy DDL
    # whenever alembic was unavailable, masking real migration failures.
    # Now a real runtime dep so the healthy path logs "Database
    # initialized via Alembic migration" and the fallback is the
    # exception, not the norm.
    "alembic>=1.13.0",
    "docker>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "celery>=5.3.0",
    # V8 Phase 5: pin redis client to 5.x range to match redis:7-alpine
    # in docker-compose. Prevents a future redis-py 6.x major bump from
    # introducing breaking API changes against the running Redis 7 server.
    "redis>=5.0.0,<6.0",
    "Jinja2>=3.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0,<2.0",
    "pip-audit>=2.7.0,<3.0",
]

[project.scripts]
webpent = "webpent.cli:main"
webpent-ingest = "webpent.cli.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webpent = ["templates/**/*.j2"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
